# Pitchroom: reverse-proxy для nginx.
#
# Установка:
#   sudo cp deploy/nginx-pitchroom.conf /etc/nginx/sites-available/pitchroom.conf
#   # поправьте server_name и, если нужно, порт бэкенда (по умолчанию 127.0.0.1:3000)
#   sudo ln -s /etc/nginx/sites-available/pitchroom.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Приложение не использует WebSocket, поэтому блок с map $http_upgrade
# и proxy_set_header Upgrade добавлять НЕ нужно.

server {
    listen 80;
    listen [::]:80;
    server_name pitchroom.example.com;

    # 30-МБ PDF с запасом; 0 = без ограничения.
    client_max_body_size 40m;

    # Не отдавать наружу служебные файлы, если они окажутся в корне.
    location ~ /\.(env|git) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # По этому заголовку приложение включает Secure-cookie и строит ссылки.
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF уходят на бэкенд сразу, без буферизации всего файла на диск.
        proxy_request_buffering off;
        # SSR-ответы стримятся клиенту по мере отрисовки.
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

