# Pitchroom: reverse-proxy для Apache 2.4 (Debian/Ubuntu).
#
# Установка:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo cp deploy/apache-pitchroom.conf /etc/apache2/sites-available/pitchroom.conf
#   # при необходимости поправьте ServerName и порт бэкенда (по умолчанию 127.0.0.1:3000)
#   sudo a2ensite pitchroom
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Приложение не использует WebSocket, поэтому параметр upgrade= указывать НЕ нужно.
# Если backend — production (wrangler dev/workerd), он переживает любые заголовки,
# но и смысла пробрасывать Upgrade нет.

<VirtualHost *:80>
    ServerName pitchroom.example.com
    # ServerAlias www.pitchroom.example.com

    # Закрывает доступ к файлу с паролем, если он случайно окажется в каталоге.
    <Files ".env">
        Require all denied
    </Files>

    ProxyPreserveHost On
    # Долгие запросы: загрузка PDF и медленные каналы.
    ProxyTimeout 300
    # Не запоминать бэкенд «в ошибке»: после перезапуска приложения
    # Apache сразу пойдёт к нему, а не будет отдавать 503 ещё минуту.
    ProxyPass        / http://127.0.0.1:3000/ retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # Чтобы приложение знало схему запроса (влияет на флаг Secure у cookie).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # 30-МБ PDF; 0 = без ограничения со стороны Apache.
    LimitRequestBody 0

    ErrorLog  ${APACHE_LOG_DIR}/pitchroom-error.log
    CustomLog ${APACHE_LOG_DIR}/pitchroom-access.log combined
</VirtualHost>

# --- HTTPS -------------------------------------------------------------------
# Сначала получите сертификат: sudo certbot certonly --apache -d pitchroom.example.com
#
# <VirtualHost *:443>
#     ServerName pitchroom.example.com
#
#     SSLEngine on
#     SSLCertificateFile    /etc/letsencrypt/live/pitchroom.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/pitchroom.example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyTimeout 300
#     ProxyPass        / http://127.0.0.1:3000/ retry=0
#     ProxyPassReverse / http://127.0.0.1:3000/
#
#     # Важно: именно так приложение включает Secure-cookie и правильные ссылки.
#     RequestHeader set X-Forwarded-Proto "https"
#
#     ErrorLog  ${APACHE_LOG_DIR}/pitchroom-error.log
#     CustomLog ${APACHE_LOG_DIR}/pitchroom-access.log combined
# </VirtualHost>
#
# <VirtualHost *:80>
#     ServerName pitchroom.example.com
#     Redirect permanent / https://pitchroom.example.com/
# </VirtualHost>
